name: CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ── Build & deploy the React web app to GitHub Pages ──────────────────────
  deploy-web:
    name: Build & Deploy Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_BASE_URL: /food-app/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build

  # ── Deploy Supabase edge function ──────────────────────────────────────────
  deploy-functions:
    name: Deploy Edge Functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Sync function source to deploy folder
        run: |
          cp src/supabase/functions/server/index.tsx   supabase/functions/make-server-36162e30/index.ts
          cp src/supabase/functions/server/kv_store.tsx supabase/functions/make-server-36162e30/kv_store.tsx

      - name: Deploy edge function
        run: |
          supabase functions deploy make-server-36162e30 \
            --project-ref qavwicfoiccfwfntumjj \
            --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
